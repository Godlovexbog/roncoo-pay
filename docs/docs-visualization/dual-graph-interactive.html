#chart{flex:1;background:#fafafa}
#detail{width:300px;background:#fff;border-left:1px solid #e0e0e0;padding:14px;overflow-y:auto;flex-shrink:0;display:none;z-index:100}

#detail .detail-section h4{font-size:12px;color:#666;margin-bottom:4px;font-weight:600;text-transform:uppercase}

#detail .tag{display:inline-block;background:#e3f2fd;color:#1565c0;padding:2px 7px;border-radius:10px;font-size:11px;margin:2px 3px 2px 0}

// ===== BUILD NODES =====
function buildAllNodes(){
    const nodes=[], nodeMap={};
    reqNodes.forEach(n=>{
        const cfg=nodeTypeConfig[n.type]||nodeTypeConfig['Method'];
        const name=n.attributes.name||n.id;
        const node={id:n.id,name:name,category:n.type,symbolSize:cfg.symbolSize,itemStyle:{color:cfg.color,borderColor:'#333',borderWidth:n.type==='Method'?1:0},_graphType:'req',_attributes:n.attributes,_type:n.type};
        nodes.push(node); nodeMap[n.id]=node;
    });
    dsNodes.forEach(n=>{
        const cfg=nodeTypeConfig[n.type]||nodeTypeConfig['Method'];
        const name=n.attributes.name||n.id.replace(/^[^:]+:/,'');
        let color=cfg.color;
        if(n.type==='Method'&&n.attributes.role){const rc=roleConfig[n.attributes.role];if(rc)color=rc.color;}
        if(n.attributes.is_cross_module)color='#ef5350';
        const node={id:n.id,name:name,category:n.type,symbolSize:cfg.symbolSize,itemStyle:{color:color,borderColor:n.type==='Method'?'#666':'#333',borderWidth:1},_graphType:'ds',_attributes:n.attributes,_type:n.type};
        nodes.push(node); nodeMap[n.id]=node;
    });
    return{nodes,nodeMap};
}

const{nodes:allNodes,nodeMap}=buildAllNodes();

// ===== BUILD EDGES =====
function buildAllEdges(){
    const edges=[];
    reqEdges.forEach(e=>{edges.push({source:e.source,target:e.target,lineStyle:{color:edgeTypeConfig[e.type]?.color||'#333',type:edgeTypeConfig[e.type]?.type||'solid',width:e.type==='semantic_similar'?2:1.5},_edgeType:e.type});});
    dsEdges.forEach(e=>{edges.push({source:e.source,target:e.target,lineStyle:{color:edgeTypeConfig[e.type]?.color||'#333',type:edgeTypeConfig[e.type]?.type||'solid',width:e.type==='similarity'?2:1.5},_edgeType:e.type});});
    mappingData.forEach(m=>{
        if(nodeMap[m.requirement_id]&&nodeMap[m.entry_method]){
            edges.push({source:m.requirement_id,target:m.entry_method,lineStyle:{color:'#e91e63',type:'dashed',width:2,curveness:0.3},_edgeType:'mapping'});
        }
    });
    return edges;
}

Object.keys(nodeTypeConfig).forEach(type=>{
    const cfg=nodeTypeConfig[type];
    const count=allNodes.filter(n=>n.category===type).length;
    nodeFilterDiv.innerHTML+=`<label><input type="checkbox" checked data-filter="node" data-value="${type}" onchange="applyFilters()"><span class="color-dot" style="background:${cfg.color}"></span>${cfg.label} (${count})</label>`;
});

const edgeFilterDiv=document.getElementById('edge-filters');
Object.keys(edgeTypeConfig).forEach(type=>{
    const cfg=edgeTypeConfig[type];
    edgeFilterDiv.innerHTML+=`<label><input type="checkbox" checked data-filter="edge" data-value="${type}" onchange="applyFilters()"><span class="color-dot" style="background:${cfg.color}"></span>${cfg.label}</label>`;
});

const roleFilterDiv=document.getElementById('role-filters');
Object.keys(roleConfig).forEach(role=>{
    const cfg=roleConfig[role];
    const count=dsNodes.filter(n=>n.attributes.role===role).length;
    if(count>0){roleFilterDiv.innerHTML+=`<label><input type="checkbox" checked data-filter="role" data-value="${role}" onchange="applyFilters()"><span class="color-dot" style="background:${cfg.color}"></span>${cfg.label} (${count})</label>`;}
});

// ===== ECHARTS =====
const chart=echarts.init(document.getElementById('chart'));

function getFilteredNodes(){
    if(currentGraph==='req')return allNodes.filter(n=>n._graphType==='req');
    if(currentGraph==='ds')return allNodes.filter(n=>n._graphType==='ds');
    return allNodes;
}

function getFilteredEdges(nodes){
    const nodeIds=new Set(nodes.map(n=>n.id));
    return allEdges.filter(e=>nodeIds.has(e.source)&&nodeIds.has(e.target));
}

function buildOption(nodes,edges){
    return{
        tooltip:{trigger:'item',formatter:function(params){
            if(params.dataType==='node'){
                const d=params.data;
                const attrs=d._attributes||{};
                const graphType=d._graphType||'ds';
                const graphLabel=graphType==='req'?'📋 需求图谱':'💻 DS-Code代码图';
                let info=`<b>${params.name}</b><br/><span style="color:${graphType==='req'?'#283593':'#880e4f'}">${graphLabel}</span>`;
                info+=`<br/>类型: ${d._type||d.category}`;
                if(attrs.purpose)info+=`<br/>目的: ${attrs.purpose}`;
                if(attrs.input)info+=`<br/>输入: ${attrs.input}`;
                if(attrs.output)info+=`<br/>输出: ${attrs.output}`;
                if(attrs.role)info+=`<br/>角色: ${attrs.role}`;
                if(attrs.external_call)info+=`<br/>外部调用: ${attrs.external_call}`;
                if(attrs.annotations)info+=`<br/>注解: ${attrs.annotations.join(', ')}`;
                if(attrs.is_cross_module)info+=`<br/><span style="color:red">跨模块调用</span>`;
                if(attrs.transactional)info+=`<br/><span style="color:green">@Transactional</span>`;
                if(attrs.call_type)info+=`<br/>调用类型: ${attrs.call_type}`;
                if(attrs.call_source)info+=`<br/>调用来源: ${attrs.call_source}`;
                if(attrs.data_access)info+=`<br/>数据访问: ${attrs.data_access}`;
                if(attrs.parameters)info+=`<br/>参数: ${attrs.parameters.join(', ')}`;
                if(attrs.return_type)info+=`<br/>返回: ${attrs.return_type}`;
                return info;
            }
            return`${params.data.source} → ${params.data.target}`;
        }},
        legend:{show:false},
        animationDuration:500,
        animationEasingUpdate:'quinticInOut',
        series:[{type:'graph',layout:'force',data:nodes,links:edges,categories:categories,roam:true,draggable:true,focusNodeAdjacency:true,force:{repulsion:currentGraph==='both'?150:120,edgeLength:[50,150],gravity:0.08,layoutAnimation:true},label:{show:true,position:'right',formatter:'{b}',fontSize:11,overflow:'truncate',width:120},lineStyle:{curveness:0.1},emphasis:{focus:'adjacency',lineStyle:{width:4}},edgeSymbol:['none','arrow'],edgeSymbolSize:8}]
    };
}

function renderChart(){
    const nodes=getFilteredNodes();
    const edges=getFilteredEdges(nodes);
    chart.setOption(buildOption(nodes,edges),true);
}

renderChart();

// ===== GRAPH SWITCH =====
function switchGraph(mode){
    currentGraph=mode;
    document.querySelectorAll('.graph-toggle button').forEach(b=>b.classList.remove('active'));
    document.getElementById('btn-'+mode).classList.add('active');
    renderChart();
}

// ===== CLICK =====
chart.on('click',function(params){
    if(params.dataType==='node'){
        showDetail(params.data);
    }
});

// ===== DETAIL =====
function showDetail(nodeData){
    const d=nodeData;
    const attrs=d._attributes||{};
    const graphType=d._graphType||'ds';
    const panel=document.getElementById('detail');
    const content=document.getElementById('detail-content');
    const graphLabel=graphType==='req'?'<span class="tag graph-req">📋 需求图谱</span>':'<span class="tag graph-ds">💻 DS-Code代码图</span>';
    let html=`<h3>${d.name}</h3>`;
    html+=`<div class="detail-section"><h4>基本信息</h4><div>`;
    html+=`<p>图谱: ${graphLabel}</p>`;
    html+=`<p>类型: <span class="tag">${d._type||d.category}</span></p>`;
    if(attrs.role)html+=`<p>角色: <span class="tag">${attrs.role}</span></p>`;
    if(attrs.is_cross_module)html+=`<p><span class="tag cross-module">跨模块调用</span></p>`;
    if(attrs.transactional)html+=`<p><span class="tag transactional">@Transactional</span></p>`;
    if(attrs.call_type)html+=`<p>调用类型: <span class="tag ${attrs.call_type&&attrs.call_type.includes('接口')?'interface-jump':'framework'}">${attrs.call_type}</span></p>`;
    if(attrs.call_source)html+=`<p>调用来源: <span class="tag ${attrs.call_source==='external'?'external':'framework'}">${attrs.call_source}</span></p>`;
    html+=`</div></div>`;
    if(attrs.purpose)html+=`<div class="detail-section"><h4>目的</h4><p>${attrs.purpose}</p></div>`;
    if(attrs.input)html+=`<div class="detail-section"><h4>输入</h4><p>${attrs.input}</p></div>`;
    if(attrs.output)html+=`<div class="detail-section"><h4>输出</h4><p>${attrs.output}</p></div>`;
    if(attrs.signal_score!==undefined)html+=`<div class="detail-section"><h4>信号评分</h4><p>${attrs.signal_score}</p></div>`;
    if(attrs.annotations)html+=`<div class="detail-section"><h4>注解</h4><p>${attrs.annotations.map(a=>`<span class="tag">${a}</span>`).join('')}</p></div>`;
    if(attrs.parameters)html+=`<div class="detail-section"><h4>参数</h4><p>${attrs.parameters.join(', ')}</p></div>`;
    if(attrs.return_type)html+=`<div class="detail-section"><h4>返回值</h4><p>${attrs.return_type}</p></div>`;
    if(attrs.external_call)html+=`<div class="detail-section"><h4>外部调用</h4><p><span class="tag cross-module">${attrs.external_call}</span></p></div>`;
    if(attrs.data_access)html+=`<div class="detail-section"><h4>数据访问</h4><p><span class="tag">${attrs.data_access}</span></p></div>`;
    if(attrs.source_signals)html+=`<div class="detail-section"><h4>信号来源</h4><p>${attrs.source_signals.map(s=>`<span class="tag">${s}</span>`).join('')}</p></div>`;
    if(attrs.trigger)html+=`<div class="detail-section"><h4>触发点</h4><p>${attrs.trigger}</p></div>`;
    if(attrs.terminal_states)html+=`<div class="detail-section"><h4>终结状态</h4><p>${attrs.terminal_states.map(s=>`<span class="tag">${s}</span>`).join('')}</p></div>`;
    const connected=allEdges.filter(e=>e.source===d.id||e.target===d.id);
    if(connected.length>0){
        html+=`<div class="detail-section"><h4>关联 (${connected.length})</h4><div>`;
        connected.forEach(e=>{
            const other=e.source===d.id?e.target:e.source;
            const dir=e.source===d.id?'→':'←';
            const edgeLabel=edgeTypeConfig[e._edgeType]?.label||e._edgeType;
            html+=`<p style="font-size:11px">${dir} <b>${other}</b> <span class="tag" style="font-size:10px">${edgeLabel}</span></p>`;
        });
        html+=`</div></div>`;
    }
    content.innerHTML=html;
    panel.classList.add('visible');
}

function closeDetail(){document.getElementById('detail').classList.remove('visible');}

// ===== SEARCH =====
function searchNode(){
    const keyword=document.getElementById('search-input').value.trim().toLowerCase();
    if(!keyword){resetZoom();return;}
    const filtered=getFilteredNodes();
    const matched=filtered.filter(n=>n.name.toLowerCase().includes(keyword));
    if(matched.length===0){alert('未找到匹配节点');return;}
    const option={series:[{data:filtered.map(n=>{const isMatch=matched.includes(n);return{...n,itemStyle:{...n.itemStyle,opacity:isMatch?1:0.15},label:{show:isMatch}};}),links:getFilteredEdges(filtered).map(e=>{const srcMatch=matched.some(m=>m.id===e.source);const tgtMatch=matched.some(m=>m.id===e.target);return{...e,lineStyle:{...e.lineStyle,opacity:(srcMatch&&tgtMatch)?1:0.05}};})}]};
    chart.setOption(option);
    chart.dispatchAction({type:'focusNodeAdjacency',seriesIndex:0,dataIndex:filtered.indexOf(matched[0])});
}

function resetZoom(){document.getElementById('search-input').value='';renderChart();}

// ===== FILTERS =====
function applyFilters(){
    const activeNodeTypes=new Set();
    document.querySelectorAll('input[data-filter="node"]:checked').forEach(cb=>activeNodeTypes.add(cb.dataset.value));
    const activeRoles=new Set();
    document.querySelectorAll('input[data-filter="role"]:checked').forEach(cb=>activeRoles.add(cb.dataset.value));
    let nodes=getFilteredNodes();
    nodes=nodes.filter(n=>{
        if(!activeNodeTypes.has(n.category))return false;
        const attrs=n._attributes||{};
        if(n.category==='Method'&&attrs.role&&!activeRoles.has(attrs.role))return false;
        return true;
    });
    const nodeIds=new Set(nodes.map(n=>n.id));
    const edges=allEdges.filter(e=>nodeIds.has(e.source)&&nodeIds.has(e.target));
    chart.setOption(buildOption(nodes,edges),true);
}

window.addEventListener('resize',()=>chart.resize());
</script>
</body>
</html>
